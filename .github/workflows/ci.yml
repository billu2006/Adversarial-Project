name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.6.9
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    # The suite runs against SQLite locally; here it runs against the real
    # thing, so the native enum, JSONB and ON DELETE CASCADE are exercised too.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: benchmark
          POSTGRES_PASSWORD: benchmark
          POSTGRES_DB: benchmark
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U benchmark"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://benchmark:benchmark@localhost:5432/benchmark
      TEST_DATABASE_URL: postgresql+psycopg://benchmark:benchmark@localhost:5432/benchmark
      REDIS_URL: redis://localhost:6379/0
      API_KEY: ci-test-key

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # CPU wheels only: the CUDA build is gigabytes and no runner has a GPU.
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -e ".[dev]" numpy

      - name: Run migrations
        # Proves the migration applies to an empty database before the tests
        # create the schema from the ORM metadata - if the two ever drift, this
        # step or the next one fails.
        run: alembic upgrade head

      - name: Check the migration matches the models
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Run tests
        run: pytest --cov=src --cov-report=term-missing

  build-images:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build --target api -t benchmark-api:ci .
      # The worker image is not built here: its PyTorch layer takes minutes,
      # and nothing downstream consumes the image. The API build is what
      # catches a broken Dockerfile.
