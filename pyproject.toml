[project]
name = "adversarial-benchmark-service"
version = "0.1.0"
description = "Asynchronous HTTP service exposing an adversarial-robustness benchmarking engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Bilal Ahmed" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "rq>=1.16",
]

[project.optional-dependencies]
# The benchmarking engine itself. Only the worker image needs these, so the API
# image can stay small and start fast.
engine = ["torch>=2.2", "torchvision>=0.17", "numpy>=1.26"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.6", "fakeredis>=2.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "engine: tests that execute the real PyTorch benchmarking engine (slow, needs weights + dataset)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# The notebook and the standalone tutorial scripts are kept in their original
# teaching style on purpose; they are not part of the service.
extend-exclude = ["notebooks", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE", "UP", "C4", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI dependency injection relies on calls in defaults

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501", "T201"]
"tests/*" = ["E501"]
